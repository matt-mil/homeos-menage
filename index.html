<script>
(function(){var m="auto";try{m=localStorage.getItem("ml_theme")||"auto"}catch(e){}
var d=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.dataset.theme=d?"dark":"light";})();
</script>
<style>
:root{--bg:#F6F5F1;--card:#fff;--tx:#1d1d1b;--tx2:#6b6a65;--tx3:#9a9993;--bd:#e4e2da;--ac:#0F6E56;--acbg:#E1F5EE;--warn:#854F0B;--warnbg:#FAEEDA;--bad:#A32D2D;--badbg:#FCEBEB;--ok:#3B6D11;--okbg:#EAF3DE;--info:#185FA5;--infobg:#E6F1FB;--r:12px}
[data-theme=dark]{--bg:#141413;--card:#1f1f1e;--tx:#f0efe9;--tx2:#a9a8a2;--tx3:#77766f;--bd:#33332f;--ac:#5DCAA5;--acbg:#0b3a2f;--warn:#FAC775;--warnbg:#3d2a08;--bad:#F09595;--badbg:#3f1414;--ok:#97C459;--okbg:#1f330b;--info:#85B7EB;--infobg:#0c2a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px calc(90px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--bd)}
header.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--tx2);font-size:13px}
.muted{color:var(--tx3);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.click{cursor:pointer}.click:active{transform:scale(.995)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
h2{font-size:15px;margin:18px 2px 8px;font-weight:600;color:var(--tx2)}
h2::first-letter{text-transform:uppercase}
h3{font-size:16px;margin:0 0 4px;font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
.p-a_faire{background:var(--warnbg);color:var(--warn)}.p-en_cours{background:var(--infobg);color:var(--info)}
.p-terminee{background:var(--acbg);color:var(--ac)}.p-validee{background:var(--okbg);color:var(--ok)}
.p-annulee{background:var(--bd);color:var(--tx2);text-decoration:line-through}
.p-nouveau{background:var(--badbg);color:var(--bad)}.p-traite{background:var(--okbg);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--tx)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
[data-theme=dark] .btn.pri{color:#04342C}
html{color-scheme:light}[data-theme=dark]{color-scheme:dark}
.btn.bad{color:var(--bad)}
.btn.block{display:flex;width:100%;padding:14px;font-size:16px}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;border:0;background:none;padding:6px 2px;font-size:11px;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
.tabs button.on{color:var(--ac);font-weight:600}
.tabs svg{width:22px;height:22px}
.badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;font-weight:600}
label.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--tx2);font-weight:500}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=month],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none}
.ck:last-child{border-bottom:0}
.ck input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bd)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:24px;padding:0}
.addph{aspect-ratio:1;border:1.5px dashed var(--tx3);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx2);font-size:12px;cursor:pointer;gap:4px}
.addph svg{width:26px;height:26px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.types button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;cursor:pointer}
.types button.on{border-color:var(--ac);background:var(--acbg);color:var(--ac);font-weight:600}
.types svg{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90%;text-align:center}
.toast.err{background:#A32D2D}
.empty{text-align:center;color:var(--tx2);padding:36px 12px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{color:var(--tx2);font-weight:500}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}
table.t th{color:var(--tx2);font-weight:500;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.seg button{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%}
.back{border:0;background:none;padding:4px 6px 4px 0;cursor:pointer;color:var(--ac);display:flex}
.back svg{width:26px;height:26px}
.prog{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ac)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px;border:1px solid var(--bd)}
.today{border-left:4px solid var(--ac)}
.icb{border:1px solid var(--bd);background:var(--card);border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);flex:none}
.icb svg{width:20px;height:20px}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 30%,#1d6b52 0%,#0d3a2c 55%,#071f17 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom));transition:opacity .45s ease,transform .45s ease;overflow:auto}
#splash.out{opacity:0;transform:scale(1.03);pointer-events:none}
.sp-in{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center}
.sp-logo{position:relative;width:96px;height:96px;color:#fff}.sp-logo svg{width:96px;height:96px;stroke-width:1.4}
.sp-spark{position:absolute;right:-6px;top:-4px;width:26px;height:26px}.sp-spark svg{width:26px;height:26px;fill:#fff}
.sp-img{width:124px;height:124px;border-radius:28px;box-shadow:0 12px 34px rgba(0,0,0,.35);margin-bottom:8px}
.sp-name{font-size:44px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1}
.sp-tag{font-size:16px;opacity:.85;margin:10px 0 30px}
.sp-feat{display:grid;gap:12px;width:100%;text-align:left}
.sp-feat div{display:flex;align-items:center;gap:14px;font-size:15px}
.sp-feat span{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none}
.sp-feat svg{width:24px;height:24px}
.sp-hi{margin:30px 0 6px;font-size:20px;font-weight:600;line-height:1.3}.sp-hi small{font-size:15px;font-weight:400;opacity:.88}
#splash .sum{font-size:14px;opacity:.75;min-height:20px}
.sp-go{margin-top:24px;width:100%;background:#1E7A5C;color:#fff;border:0;border-radius:16px;padding:16px;font-weight:600;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.sp-go svg{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;color:var(--tx3);padding:4px 0;text-transform:uppercase}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border:1px solid transparent;gap:3px}
.cal .d.o{color:var(--tx3)}.cal .d.t{border-color:var(--ac);font-weight:700;color:var(--ac)}
.cal .d.s{background:var(--ac);color:#fff}[data-theme=dark] .cal .d.s{color:#04342C}
.cal .dots{display:flex;gap:2px;height:6px}.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cal .dots i.en_cours{background:var(--info)}.cal .dots i.terminee,.cal .dots i.validee{background:var(--ok)}
.cal .d.s .dots i{background:#fff}
.new{background:var(--infobg);color:var(--info)}
.banner{display:flex;gap:12px;align-items:center;background:var(--acbg);color:var(--ac);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;font-size:14px}
.banner svg{width:22px;height:22px;flex:none}
.card .row>span>svg{width:22px;height:22px}
.btn svg{width:18px;height:18px;flex:none}
:root{--hero:#0F4D3A;--hero2:#1E7A5C}[data-theme=dark]{--hero:#0a2c22;--hero2:#1d6b52}
body.agent header.top{display:none}
body.agent .wrap{padding:0 0 calc(86px + env(safe-area-inset-bottom));max-width:560px}
body.agent .tabs{max-width:none}
.a-hero{background:var(--hero);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 38px}
.a-hrow{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto}
.a-ht{flex:1;min-width:0;font-size:21px;font-weight:700}
.a-hs{font-size:14px;font-weight:400;opacity:.85;display:flex;align-items:center;gap:4px}.a-hs svg{width:15px;height:15px}
.a-hi{font-size:20px;font-weight:700;line-height:1.2}
.a-ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:20px}
.a-ib svg{width:22px;height:22px}.a-ib.sm{width:34px;height:34px;background:var(--acbg);color:var(--ac)}.a-ib.dark{background:var(--bg);color:var(--tx)}
.a-ib.glass{background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.flip svg{transform:scaleX(-1)}
.a-av{border-radius:50%;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.7);flex:none}
.a-av.ini{background:var(--hero2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.a-avedit{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--hero);display:flex;align-items:center;justify-content:center}.a-avedit svg{width:17px;height:17px}
.a-day{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--tx);border-radius:18px;padding:10px 12px;margin:16px auto -64px;max-width:560px;position:relative;z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.12)}

.a-home{padding-bottom:42px}

.a-box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.a-box .row>svg{width:24px;height:24px;color:var(--ac);flex:none}
.a-bt{font-size:17px;font-weight:700;margin-bottom:8px}
.a-today{display:flex;gap:12px;align-items:center;padding:6px 0}.a-today+.a-today{border-top:1px solid var(--bd);padding-top:12px;margin-top:6px}
.a-btn{margin-top:10px;background:var(--hero);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;width:100%;max-width:220px}
[data-theme=dark] .a-btn{background:var(--hero2)}
.a-th{width:58px;height:58px;border-radius:12px;background-size:cover;background-position:center;flex:none}
.a-th.sm{width:46px;height:46px}.a-thl{width:96px;height:96px;border-radius:14px;background-size:cover;background-position:center;flex:none}
.ph0{background:linear-gradient(135deg,var(--hero2),var(--hero));display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85)}.ph0 svg{width:46%;height:46%}
.a-mt{font-weight:700;font-size:16px;line-height:1.25}

.a-mc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;margin-bottom:10px;flex:1;min-width:0}
.a-pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.a-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 6px}
.a-stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 6px;text-align:center}
.a-stat b{display:block;font-size:26px;color:var(--ac);line-height:1.1}.a-stat b.red{color:var(--bad)}.a-stat span{font-size:12px;color:var(--tx2)}
.a-sec{font-size:16px;font-weight:700;margin:18px 2px 10px}
.a-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.a-quick button,.a-info button,.a-types button{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--tx);cursor:pointer;text-align:center}
.a-quick svg,.a-info svg,.a-types svg{width:28px;height:28px;color:var(--ac)}
.a-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.a-types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.a-types button.on{background:var(--hero);border-color:var(--hero);color:#fff}.a-types button.on svg{color:#fff}
.a-seg{display:flex;background:rgba(255,255,255,.14);border-radius:14px;padding:4px;margin:16px auto 0;max-width:560px}
.a-seg button{flex:1;border:0;background:none;color:#fff;padding:9px;border-radius:11px;font-weight:600;cursor:pointer;font-size:15px}
.a-seg button.on{background:#fff;color:var(--hero)}
.a-seg.light{background:var(--card);border:1px solid var(--bd);margin:0 0 14px}
.a-seg.light button{color:var(--tx2)}.a-seg.light button.on{background:var(--hero);color:#fff}
.a-wk{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}.a-wk b{font-size:17px}
.a-nb{border:0;background:none;color:var(--tx);cursor:pointer;padding:6px;display:flex}.a-nb svg{width:24px;height:24px}
.a-wrow{display:flex;gap:10px;align-items:center}
.a-wd{width:44px;flex:none;text-align:center;color:var(--tx2);font-size:13px;text-transform:capitalize}.a-wd b{display:block;font-size:20px;color:var(--tx)}.a-wd.t b,.a-wd.t span{color:var(--ac)}
.a-cover{height:240px;background:var(--hero) center/cover no-repeat;position:relative}
.a-cov0{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);background:linear-gradient(135deg,var(--hero2),var(--hero))}.a-cov0 svg{width:110px;height:110px}
.a-covbar{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px}
.a-big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--hero);color:#fff;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:600;cursor:pointer;margin:6px 0 4px}

.a-big.soft{background:var(--acbg);color:var(--ac)}

.a-gb{padding:0 14px 6px}

.a-rl{text-align:center;font-weight:600;margin-top:6px}

function sheet(title, html) {

// ---- Checklist
async function aChecklist(id) {
  let m; try { m = await getMission(id); } catch(e) { toast(e.message,true); return; }
  const p = m.property||{}, groups = parseChecklist(mChecklist(m)), st = {...(m.checklist_state||{})};
  const spec = m.kind === "speciale";
  const locked = ["terminee","validee"].includes(m.status);
  S.open = S.open || {};
  const draw = () => {
    const pr = ckProgress({...m, checklist_state: st});
    $("app").innerHTML = hero(spec ? "Checklist mission" : "Checklist ménage", {back:true, sub:`${I.pin}${esc(spec ? m.title + " · " + p.name : p.name)}`}) + `<div class="a-sheet">
      <div class="row" style="gap:12px;margin:2px 2px 14px"><div class="prog sp" style="height:10px;margin:0"><i style="width:${pr.pct}%"></i></div><div style="text-align:right"><b>${pr.d} / ${pr.n}</b><div class="muted" style="font-size:12px">${pr.pct}%</div></div></div>
      ${groups.length ? groups.map((g, gi) => { const dn = g.items.filter(i => st[ckKey(g.room,i)]||st[i]).length; const op = S.open[g.room] ?? (gi===0 || (dn<g.items.length && groups.slice(0,gi).every(x=>x.items.every(i=>st[ckKey(x.room,i)]||st[i])))); return `
        <div class="a-grp ${op?"op":""}"><button class="a-gh" data-g="${esc(g.room)}">${roomIcon(g.room)}<b class="sp">${esc(g.room)} <span class="muted">(${dn}/${g.items.length})</span></b>${dn===g.items.length?`<span style="color:var(--ok)">${I.check}</span>`:""}<span class="chev">⌄</span></button>
        ${op?`<div class="a-gb">${g.items.map(i => `<label class="ck"><input type="checkbox" data-k="${esc(ckKey(g.room,i))}" ${(st[ckKey(g.room,i)]||st[i])?"checked":""} ${locked?"disabled":""}><span>${esc(i)}</span></label>`).join("")}</div>`:""}</div>`; }).join("")
        : `<div class="empty" style="padding:20px">${spec ? "Pas de checklist pour cette mission : suis les consignes, puis valide." : "Pas de checklist pour ce logement."}</div>`}
      ${locked ? `<div class="a-done">${I.check}<b>${spec?"Mission":"Ménage"} ${m.status==="validee"?"validé":"terminé"}${spec?"e":""}</b></div>` : `
        <label class="f">Commentaire pour Matthis (facultatif)</label><textarea id="cmt" placeholder="Tout s'est bien passé, clé laissée dans la boîte…">${esc(m.comment||"")}</textarea>
        <button class="a-big ${pr.d===pr.n?"":"soft"}" id="val">${I.send} ${spec?"Valider la mission":"Valider le ménage"}</button>`}
    </div>`;
    bindHero();
    $("app").querySelectorAll("[data-g]").forEach(b => b.onclick = () => { const r = b.dataset.g; const cur = $("app").querySelector(`[data-g="${CSS.escape(r)}"]`).parentElement.classList.contains("op"); S.open[r] = !cur; draw(); });
    $("app").querySelectorAll("[data-k]").forEach(c => c.onchange = async () => {
      st[c.dataset.k] = c.checked; m.checklist_state = st;
      try { await api("checklist_update",{id, state:st}); if (m.status==="a_faire") { m.status="en_cours"; S.data=null; } } catch(e) { toast(e.message,true); }
      draw();
    });
    if ($("val")) $("val").onclick = e => {
      const ap = m.photos.filter(x=>x.kind==="apres").length;
      if (!ap && m.require_photo !== false) { toast("Ajoute au moins une photo « après » pour valider"); return goView({type:"photos", id, kind:"apres"}); }
      const left = pr.n - pr.d;
      if (left && !confirm(`${left} point(s) non cochés. Valider quand même ?`)) return;
      run(e.currentTarget, async () => { S.mc[id] = (await api("mission_finish",{id, comment:$("cmt").value})).mission; S.data = null; toast(spec ? "Mission validée, merci ! 🎉" : "Ménage validé, merci ! 🎉"); S.view = {type:"mission", id, back:null}; render(); window.scrollTo(0,0); });
    };
  };
  draw();
}
function roomIcon(r) { const s = r.toLowerCase(); return s.includes("cuisine") ? I.chef : s.includes("bain")||s.includes("wc") ? I.bath : s.includes("chambre") ? I.bed : s.includes("salon")||s.includes("séjour") ? I.sofa : I.home; }

  let m; try { m = await getMission(id); } catch(e) { toast(e.message,true); return; }
  const p = m.property||{}, locked = ["terminee","validee"].includes(m.status), rooms = roomsOf(m);

    const ph = m.photos.filter(x => x.kind===kind);
    const other = ph.filter(x => !x.room || !rooms.includes(x.room));
    $("app").innerHTML = hero("Photos Avant / Après", {back:true, sub:`${I.pin}${esc(p.name)}`}) + `<div class="a-sheet">
      <div class="a-seg light"><button data-k="avant" class="${kind==="avant"?"on":""}">Avant intervention</button><button data-k="apres" class="${kind==="apres"?"on":""}">Après intervention</button></div>
      <div class="a-rooms">${rooms.map(r => { const rp = ph.filter(x => x.room===r); const last = rp[rp.length-1];
        return `<div class="a-room"><div class="a-rimg ${last?"":"e"}" ${last?`style="background-image:url('${esc(last.url)}')"`:""} data-add="${esc(r)}">${locked&&!last?"":`<span class="a-cam">${I.cam}</span>`}${rp.length>1?`<span class="a-cnt">${rp.length}</span>`:""}</div><div class="a-rl">${esc(r)}</div></div>`; }).join("")}</div>
      ${ph.length ? `<div class="a-sec">Toutes les photos ${kind==="avant"?"avant":"après"} (${ph.length})</div>${photoGrid(ph,{del:!locked})}` : ""}
      ${locked ? "" : `<button class="a-big soft" data-add="" style="margin-top:16px">${I.cam} Ajouter des photos</button>`}
      ${kind==="avant"&&!locked?`<button class="btn block" id="nx" style="margin-top:10px">Passer à la checklist ›</button>`:""}
      ${kind==="apres"&&!locked&&ph.length?`<button class="btn block" id="nx2" style="margin-top:10px">Aller valider le ménage ›</button>`:""}
    </div>`;
    bindHero(); bindLb();
    $("app").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { kind = b.dataset.k; S.view.kind = kind; draw(); });
    if ($("nx")) $("nx").onclick = () => goView({type:"checklist", id});
    if ($("nx2")) $("nx2").onclick = () => goView({type:"checklist", id});
    $("app").querySelectorAll("[data-add]").forEach(a => a.onclick = async () => {
      const room = a.dataset.add;
      const has = room && ph.some(x => x.room===room);
      if (locked) { if (has) lightbox(ph.filter(x=>x.room===room).pop().url); return; }
      const files = await pickPhotos(true); if (!files.length) return;
      toast(`Envoi de ${files.length} photo${files.length>1?"s":""}…`);
      let n = 0;
      for (const f of files) { try { const data = await compress(f); m = (await api("photo_add",{id, kind, data, room: room||null})).mission; S.mc[id] = m; n++; } catch(e) { toast(e.message,true); } }
      if (m.status !== "a_faire") S.data = null;
      draw(); if (n) toast(n>1?`${n} photos ajoutées`:"Photo ajoutée");
    });
    $("app").querySelectorAll("[data-del]").forEach(b => b.onclick = async ev => {
      ev.stopPropagation(); if (!confirm("Supprimer cette photo ?")) return;
      try { m = (await api("photo_delete",{mission_id:id, id:b.dataset.del})).mission; S.mc[id] = m; draw(); } catch(e) { toast(e.message,true); }
    });
  };
  draw();
}

// ---- Consommables & linge
function unitOf(name) { const s = name.toLowerCase(); return s.includes("papier") ? "rouleaux" : s.includes("sac") ? "" : s.includes("serviette")||s.includes("drap")||s.includes("taie")||s.includes("housse")||s.includes("torchon")||s.includes("tapis") ? "" : ""; }
function stockIcon(name) { const s = name.toLowerCase(); return s.includes("papier") ? I.roll : s.includes("sac") ? I.bag : s.includes("éponge")||s.includes("eponge") ? I.sponge : s.includes("lessive")||s.includes("savon")||s.includes("gel")||s.includes("liquide")||s.includes("produit") ? I.bottle : s.includes("café")||s.includes("thé") ? I.cup : I.shirt; }
async function aStock(tab) {
  let d; try { d = await loadMine(!S.data); } catch(e) { toast(e.message,true); return; }
  const props = [...new Map(d.missions.filter(m=>m.property).map(m => [m.property.id, m.property])).values()];
  if (!props.length) { $("app").innerHTML = hero("Consommables & Linge",{back:true}) + `<div class="a-sheet"><div class="empty">Aucun logement ne t'est encore attribué.</div></div>`; bindHero(); return; }
  S.stockProp = props.find(p => p.id===S.stockProp) ? S.stockProp : (focusMission()?.property_id || props[0].id);
  const p = props.find(x => x.id===S.stockProp); p.stock = p.stock || {};
  const items = tab==="linge" ? LINGE.filter(x => !/taché/i.test(x)) : (p.consumables||[]);
  const low = items.filter(x => (p.stock[x] ?? 0) <= 2);
  const draw = () => {
    $("app").innerHTML = hero("Consommables & Linge",{back:true, sub: props.length>1?"":`${I.pin}${esc(p.name)}`}) + `<div class="a-sheet">
      ${props.length>1?`<select id="sp" style="margin-bottom:12px">${props.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}
      <div class="a-seg light"><button data-t="consommable" class="${tab!=="linge"?"on":""}">Consommables</button><button data-t="linge" class="${tab==="linge"?"on":""}">Linge</button></div>
      ${items.length ? items.map((x,i) => { const q = p.stock[x] ?? 0, c = q<=1?"r":q<=3?"o":"g", w = Math.max(6, Math.min(100, q*10));
        return `<div class="a-stk">${stockIcon(x)}<div class="sp"><b>${esc(x)}</b><div class="muted" style="font-size:13px">Stock : ${q}${unitOf(x)?" "+unitOf(x):""}</div><div class="a-bar ${c}"><i style="width:${w}%"></i></div></div>
          <button class="a-pm" data-i="${i}" data-d="-1" aria-label="Retirer un">−</button><button class="a-pm" data-i="${i}" data-d="1" aria-label="Ajouter un">+</button></div>`; }).join("")
        : `<div class="empty">Aucun consommable défini pour ce logement.</div>`}
      <div class="muted" style="margin:6px 4px 0;font-size:13px">Mets à jour le stock en partant. Ce qui est à 2 ou moins part dans la demande de réapprovisionnement.</div>
      <button class="a-big" id="reap" style="margin-top:14px">${I.cart} Réapprovisionnement${low.length?` (${low.length})`:""}</button>
    </div>`;

    $("app").querySelectorAll("[data-t]").forEach(b => b.onclick = () => { S.view.tab = b.dataset.t; aStock(b.dataset.t); });
    $("app").querySelectorAll(".a-pm").forEach(b => b.onclick = async () => {
      const x = items[+b.dataset.i], q = Math.max(0, (p.stock[x] ?? 0) + +b.dataset.d);
      p.stock[x] = q; draw();
      try { const r = await api("stock_set",{property_id:p.id, item:x, qty:q}); p.stock = r.stock; } catch(e) { toast(e.message,true); }
    });
    $("reap").onclick = e => {
      const lw = items.filter(x => (p.stock[x] ?? 0) <= 2);
      if (!lw.length) return toast("Tout est en stock 👍");
      if (!confirm(`Demander le réapprovisionnement de :\n• ${lw.join("\n• ")}`)) return;
      run(e.currentTarget, async () => { const fm = focusMission();
        await api("report_create",{property_id:p.id, mission_id: fm && fm.property_id===p.id ? fm.id : undefined, type: tab==="linge"?"linge":"consommable", title:"Réapprovisionnement", items: lw.map(x => `${x} (${p.stock[x] ?? 0})`)});
        S.data = null; toast("Demande envoyée à Matthis"); });
    };
  };
  draw();
}

function compressSize(file, max) {
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas"); c.width = c.height = max;
      c.getContext("2d").drawImage(img, (img.naturalWidth-s)/2, (img.naturalHeight-s)/2, s, s, 0, 0, max, max); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .8)); };
    img.onerror = () => rej(new Error("Image illisible")); img.src = url; });
}

  if (planFilter==="annulee") list = list.filter(m => m.status==="annulee");
  let html = `<div class="grid2" style="grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px">

    if (m.date !== last) { last = m.date; html += `<h2>${m.date===t?"Aujourd'hui · ":""}${fdate(m.date)}</h2>`; }

    <div><label class="f">Fin</label><input type="time" id="me" value="${(m?.end_time||p0?.default_end||"16:00").slice(0,5)}"></div></div>
    <label class="f">Agent</label><select id="mc"><option value="">— Aucun —</option>${d.cleaners.map(c=>`<option value="${c.id}" ${(m?m.cleaner_id:p0?.cleaner_id)===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
    ${m?`<label class="f">Statut</label><select id="mst">${Object.entries(ST).map(([k,l])=>`<option value="${k}" ${m.status===k?"selected":""}>${l}</option>`).join("")}</select>`:""}
    <label class="f">Consignes ${kind==="speciale"?"de la mission":"particulières pour ce ménage"}</label><textarea id="mdsc" placeholder="${kind==="speciale"?"Ex. : Les décos sont dans le carton rouge du placard. Sapin dans le salon, guirlande sur le balcon.":"Facultatif : ex. arrivée anticipée à 14h, lit bébé à installer…"}">${esc(keep?keep.ds:(m?.description||""))}</textarea>
    ${kind==="menage"?`<label class="ck" style="border:0;margin-top:6px"><input type="checkbox" id="mown" ${(keep?keep.own:ownCk)?"checked":""}><span class="sub">Checklist spéciale pour ce ménage (sinon celle du logement)</span></label>`:""}
    <div id="ckw" style="${kind==="menage"&&!(keep?keep.own:ownCk)?"display:none":""}"><label class="f">Checklist ${kind==="speciale"?"de la mission (facultatif)":"de ce ménage"}</label>
    <textarea id="mck" style="min-height:160px" placeholder="# Salon&#10;Installer le sapin&#10;Brancher la guirlande&#10;# Extérieur&#10;Guirlande sur le balcon">${esc(keep?keep.ck:(ownCk?m.checklist.join("\n"):(kind==="menage"?(p0?.checklist||[]).join("\n"):"")))}</textarea>
    <div class="muted">Une tâche par ligne. « # Nom » crée une rubrique.</div></div>
    <label class="ck" style="border:0;margin-top:6px"><input type="checkbox" id="mrp" ${(keep?keep.rp:(m?m.require_photo!==false:kind==="menage"))?"checked":""}><span class="sub">Photo « après » obligatoire pour terminer</span></label>
    <button class="btn pri block" id="ms_save" style="margin-top:12px">Enregistrer${m?"":" et prévenir l'agent"}</button></div>
    ${!m?`<p class="muted">Les ménages liés aux réservations Airbnb sont créés automatiquement. Ici, tu ajoutes un ménage ponctuel ou une mission particulière (décos, vérification, livraison…). L'agent reçoit une notification.</p>`:""}`;
    $("app").querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { kind = b.dataset.kind; draw(); });
    if ($("mown")) $("mown").onchange = () => { $("ckw").style.display = $("mown").checked ? "" : "none"; };
    if (!m) $("mp").onchange = e => { const p = d.properties.find(x=>x.id===e.target.value); $("ms").value=p.default_start.slice(0,5); $("me").value=p.default_end.slice(0,5); $("mc").value=p.cleaner_id||""; };
    $("ms_save").onclick = e => {
      const title = $("mt").value.trim();
      if (kind==="speciale" && !title) return toast("Donne un intitulé à la mission", true);
      const useCk = kind==="speciale" || $("mown")?.checked;
      const ck = useCk ? $("mck").value.split("\n").map(x=>x.trim()).filter(Boolean) : [];
      run(e.currentTarget, async () => {
        await api("mission_save", {id:m?.id, property_id:$("mp").value, date:$("md").value, start_time:$("ms").value, end_time:$("me").value, cleaner_id:$("mc").value, status:m?$("mst").value:undefined,
          kind, title: kind==="speciale"?title:null, description:$("mdsc").value.trim(), checklist: ck, require_photo:$("mrp").checked});
        toast("Mission enregistrée"); await refresh(); go(m ? {type:"mission", id:m.id} : null);
      });
    };
  };
  draw();
}

function reportCard(r) {
  const [l, ic] = TYPES[r.type] || [r.type, ""];
  return `<div class="card"><div class="row"><span style="width:24px;color:var(--tx2)">${ic}</span><div class="sp"><h3 style="font-size:15px">${r.title?esc(r.title)+" · ":""}${l}${r.property?" · "+esc(r.property.name):""}</h3>
    <div class="muted">${new Date(r.created_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}${r.cleaner?" · "+esc(r.cleaner.name):""}</div></div>${pill(r.status)}</div>
    ${r.items?.length?`<div style="margin-top:8px;font-size:14px">${r.items.map(esc).join(" · ")}</div>`:""}
    ${r.comment?`<div class="sub" style="margin-top:6px;white-space:pre-wrap">${esc(r.comment)}</div>`:""}
    ${r.photos?.length?photoGrid(r.photos):""}
    ${S.role==="admin"&&r.property?`<div style="margin-top:10px"><button class="btn sm" data-rs="${r.id}" data-to="${r.status==="nouveau"?"traite":"nouveau"}">${r.status==="nouveau"?"Marquer comme traité":"Remettre à traiter"}</button></div>`:""}</div>`;
}
let repFilter = "nouveau";
function adminReports(d) {
  header("Signalements");
  const list = d.reports.filter(r => repFilter==="all" || r.status===repFilter);
  const shop = {};
  d.reports.filter(r=>r.status==="nouveau" && ["linge","consommable"].includes(r.type)).forEach(r => r.items.forEach(x => { const k = x+" · "+(r.property?.name||""); shop[k]=(shop[k]||0)+1; }));
  $("app").innerHTML = `<div class="seg">${[["nouveau","À traiter"],["traite","Traités"],["all","Tous"]].map(([k,l])=>`<button data-f="${k}" class="${repFilter===k?"on":""}">${l}</button>`).join("")}</div>
    ${repFilter==="nouveau"&&Object.keys(shop).length?`<div class="card"><h3 style="font-size:15px">Liste de courses / réassort</h3>${Object.keys(shop).sort().map(k=>`<div class="sub">• ${esc(k)}</div>`).join("")}</div>`:""}
    ${list.length?list.map(reportCard).join(""):`<div class="empty">Aucun signalement ${repFilter==="nouveau"?"à traiter":""}.</div>`}`;
  bindLb();
  $("app").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { repFilter=b.dataset.f; adminReports(d); });
  $("app").querySelectorAll("[data-rs]").forEach(b => b.onclick = e => run(e.currentTarget, async () => { await api("report_update",{id:b.dataset.rs, status:b.dataset.to}); await refresh(); }));
}

function adminProps(d) {
  header("Logements", null, `<button class="btn sm pri" id="np">+ Logement</button>`);
  $("np").onclick = () => go({type:"prop"});
  $("app").innerHTML = d.properties.length ? d.properties.map(p => `<div class="card click" data-p="${p.id}"><div class="row">${thumb(p,"a-th")}<div class="sp"><h3>${esc(p.name)}</h3>
    <div class="sub">${hm(p.default_start)} – ${hm(p.default_end)} · ${esc(d.cleaners.find(c=>c.id===p.cleaner_id)?.name||"Pas d'agent attitré")}</div>
    <div class="muted">${p.ical_urls.length?`${p.ical_urls.length} calendrier(s) · ${p.last_sync_at?"synchro "+new Date(p.last_sync_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"jamais synchronisé"}`:"Aucun calendrier : missions manuelles uniquement"}</div>
    ${p.last_sync_error?`<div style="color:var(--bad);font-size:13px">${esc(p.last_sync_error)}</div>`:""}</div></div></div>`).join("")
    : `<div class="empty"><h3>Aucun logement</h3><p>Ajoutez votre premier logement avec son lien de calendrier.</p></div>`;
  $("app").querySelectorAll("[data-p]").forEach(c => c.onclick = () => go({type:"prop", id:c.dataset.p}));
}
function propForm(id) {
  const d = S.data, p = d.properties.find(x=>x.id===id) || {name:"",address:"",ical_urls:[],default_start:"10:00",default_end:"16:00",cleaner_id:d.cleaners[0]?.id||null,
    checklist:["# Salon & Séjour","Dépoussiérer les surfaces","Nettoyer la TV et les meubles","Aspirer et laver le sol","Vérifier l'état du canapé","# Cuisine","Vaisselle propre et rangée","Plan de travail et plaques","Frigo vidé et nettoyé","Poubelles vidées","# Chambre","Draps et housses changés","Lit fait","Aspirer et laver le sol","# Salle de bain","Douche et lavabo","WC désinfectés","Serviettes propres","# Avant de partir","Toutes les fenêtres sont fermées","Toutes les lumières sont éteintes"],
    consumables:["Papier toilette","Produits ménagers","Sacs poubelle","Éponges","Lessive","Savon / gel douche","Liquide vaisselle","Café / thé"], notes:"", access_info:"", equipment:"", stock:{}};
  header(id ? "Modifier le logement" : "Nouveau logement", () => go(null));
  $("app").innerHTML = `${id?`<div class="card"><label class="f" style="margin-top:0">Photo du logement (vue par l'agent)</label>
    <div class="row" style="gap:12px">${thumb(p,"a-thl")}<button class="btn" id="pph">${I.cam} ${p.photo_url?"Changer la photo":"Ajouter une photo"}</button></div></div>`:""}
    <div class="card">
    <label class="f" style="margin-top:0">Nom du logement</label><input type="text" id="pn" value="${esc(p.name)}" placeholder="Elbeuf · T2 rue du 1er Mai">
    <label class="f">Adresse (visible par l'agent)</label><input type="text" id="pa" value="${esc(p.address||"")}" placeholder="12 rue du 1er Mai, 76500 Elbeuf">
    <label class="f">Liens de calendrier iCal (un par ligne)</label><textarea id="pi" placeholder="https://www.airbnb.fr/calendar/ical/123456.ics?s=…">${esc(p.ical_urls.join("\n"))}</textarea>
    <div class="muted">Airbnb : Annonces › votre logement › Disponibilités › Connecter des calendriers › Exporter le calendrier. Booking : Tarifs et disponibilités › Synchroniser les calendriers.</div>
    <div class="grid2"><div><label class="f">Ménage de</label><input type="time" id="ps" value="${p.default_start.slice(0,5)}"></div><div><label class="f">à</label><input type="time" id="pe" value="${p.default_end.slice(0,5)}"></div></div>
    <label class="f">Agent attitré</label><select id="pc"><option value="">— Aucun —</option>${d.cleaners.map(c=>`<option value="${c.id}" ${p.cleaner_id===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
    ${id?`<label class="ck" style="border:0"><input type="checkbox" id="pac" checked><span class="sub">Appliquer aussi aux missions à venir déjà créées</span></label>`:""}
    <label class="f">Checklist ménage (une tâche par ligne)</label><textarea id="pk" style="min-height:220px">${esc(p.checklist.join("\n"))}</textarea>
    <div class="muted">Commence une ligne par <b>#</b> pour créer une pièce (ex. « # Cuisine ») : l'agent verra la checklist et les photos rangées par pièce.</div>
    <label class="f">Consommables à surveiller (un par ligne)</label><textarea id="pco" style="min-height:130px">${esc(p.consumables.join("\n"))}</textarea>
    <label class="f">Consignes spécifiques</label><textarea id="pno" placeholder="Local poubelles, où ranger le linge sale, points d'attention…">${esc(p.notes||"")}</textarea>
    <label class="f">Accès & code</label><textarea id="pac2" placeholder="Code boîte à clés 1234, digicode, étage, place de parking…">${esc(p.access_info||"")}</textarea>
    <label class="f">Équipements du logement</label><textarea id="peq" placeholder="Aspirateur dans le placard de l'entrée, lave-linge, produits sous l'évier…">${esc(p.equipment||"")}</textarea>
    ${id&&Object.keys(p.stock||{}).length?`<label class="f">Stock déclaré par l'agent</label><div class="sub">${Object.entries(p.stock).map(([k,v])=>`<span style="${v<=2?"color:var(--bad);font-weight:600":""}">${esc(k)} : ${v}</span>`).join(" · ")}</div>`:""}
    <button class="btn pri block" id="psave" style="margin-top:16px">Enregistrer${p.ical_urls.length||!id?" et synchroniser":""}</button>
    ${id?`<button class="btn bad block" id="pdel" style="margin-top:8px">Retirer ce logement</button>`:""}</div>`;
  const lines = v => v.split("\n").map(x=>x.trim()).filter(Boolean);
  $("psave").onclick = e => run(e.currentTarget, async () => {
    const r = await api("property_save", {id, name:$("pn").value.trim(), address:$("pa").value.trim(), ical_urls:lines($("pi").value), default_start:$("ps").value, default_end:$("pe").value,
      cleaner_id:$("pc").value, apply_cleaner: $("pac")?.checked, checklist:lines($("pk").value), consumables:lines($("pco").value), notes:$("pno").value.trim(), access_info:$("pac2").value.trim(), equipment:$("peq").value.trim()});
    if (r.sync?.error) toast("Logement enregistré, mais le calendrier n'a pas pu être lu : " + r.sync.error, true);
    else toast(r.sync ? `Enregistré · ${r.sync.created} mission(s) créée(s)` : "Logement enregistré");
    await refresh(); go(null);
  });
  if ($("pdel")) $("pdel").onclick = e => { if (confirm("Retirer ce logement ? Ses missions passées restent dans le récap.")) run(e.currentTarget, async () => { await api("property_delete",{id}); await refresh(); go(null); }); };
  if ($("pph")) $("pph").onclick = async e => { const [f] = await pickPhotos(false); if (!f) return; run(e.currentTarget, async () => { await api("property_photo",{id, data: await compress(f)}); toast("Photo enregistrée"); await refresh(); go({type:"prop", id}); }); };
}

function emergencyForm(el) {
  const e = S.emergency || {};
  el.innerHTML = `<div class="card"><div class="row"><span style="color:#D94848">${I.phone}</span><div class="sp"><h3 style="font-size:15px">Appel d'urgence</h3><div class="sub">Le numéro que l'agent appelle depuis le bouton rouge des signalements (le 112 est toujours proposé en plus).</div></div></div>
    <div class="grid2"><div><label class="f">Nom affiché</label><input type="text" id="en" value="${esc(e.name||"Matthis")}"></div><div><label class="f">Téléphone</label><input type="tel" id="ep" value="${esc(e.phone||"")}" placeholder="06 12 34 56 78"></div></div>
    <button class="btn pri block" id="esv" style="margin-top:12px">Enregistrer</button></div>`;
  $("esv").onclick = ev => run(ev.currentTarget, async () => { await api("settings_save",{emergency_name:$("en").value.trim(), emergency_phone:$("ep").value.trim()}); S.emergency = {name:$("en").value.trim(), phone:$("ep").value.trim()}; toast("Numéro d'urgence enregistré"); });
}
function agentLink(c) { return location.origin + location.pathname + "?t=" + c.token; }
function adminAgents(d) {
  header("Agents de ménage", null, `<button class="btn sm pri" id="na">+ Agent</button>`);
  $("na").onclick = () => editAgent(null);
  $("app").innerHTML = (d.cleaners.length ? d.cleaners.map(c => {
    const link = agentLink(c);
    const msg = encodeURIComponent(`Bonjour ${c.name.split(" ")[0]}, voici ton accès à My Laeti : ${link}\nOuvre-le sur ton téléphone, ajoute-le à l'écran d'accueil, puis active les notifications dans Réglages.`);
    const nb = d.missions.filter(m=>m.cleaner_id===c.id && m.date>=d.today && m.status==="a_faire").length;
    return `<div class="card"><div class="row"><div class="sp"><h3>${esc(c.name)}</h3><div class="sub">${esc(c.phone||"")}${c.phone?" · ":""}${nb} mission(s) à venir</div></div>
      <button class="btn sm" data-e="${c.id}">Modifier</button></div>
      <label class="f">Lien personnel</label><div class="code">${esc(link)}</div>
      <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">
        <button class="btn sm" data-cp="${esc(link)}">Copier</button>
        <a class="btn sm" href="https://wa.me/${(c.phone||"").replace(/[^\d]/g,"").replace(/^0/,"33")}?text=${msg}" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn sm" href="sms:${esc(c.phone||"")}?&body=${msg}">SMS</a>
        <button class="btn sm" data-nl="${c.id}">Nouveau lien</button></div></div>`;
  }).join("") : `<div class="empty"><h3>Aucun agent</h3><p>Ajoutez votre agent de ménage pour lui envoyer son lien d'accès.</p></div>`) +
  `<div class="card" style="background:var(--bg)"><h3 style="font-size:15px">Votre accès gestionnaire</h3><div class="muted">Gardez ce lien pour vous : il donne accès à tout.</div><div class="code" style="margin-top:6px">${esc(location.origin+location.pathname+"?t="+TOKEN)}</div></div>`;
  $("app").querySelectorAll("[data-e]").forEach(b => b.onclick = () => editAgent(d.cleaners.find(c=>c.id===b.dataset.e)));
  $("app").querySelectorAll("[data-cp]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.cp); toast("Lien copié"); } catch(e) { prompt("Copiez le lien :", b.dataset.cp); } });
  $("app").querySelectorAll("[data-nl]").forEach(b => b.onclick = e => { if (confirm("Créer un nouveau lien ? L'ancien ne fonctionnera plus.")) run(e.currentTarget, async () => { await api("cleaner_new_link",{id:b.dataset.nl}); await refresh(); toast("Nouveau lien créé"); }); });
}
function editAgent(c) {
  header(c ? "Modifier l'agent" : "Nouvel agent", () => go(null));
  $("app").innerHTML = `<div class="card"><label class="f" style="margin-top:0">Prénom et nom</label><input type="text" id="an" value="${esc(c?.name||"")}" placeholder="Sophie Martin">
    <label class="f">Téléphone</label><input type="tel" id="at" value="${esc(c?.phone||"")}" placeholder="06 12 34 56 78">
    <button class="btn pri block" id="asave" style="margin-top:16px">Enregistrer</button>
    ${c?`<button class="btn bad block" id="adel" style="margin-top:8px">Désactiver cet agent</button>`:""}</div>`;
  $("asave").onclick = e => run(e.currentTarget, async () => { await api("cleaner_save",{id:c?.id, name:$("an").value.trim(), phone:$("at").value.trim()}); await refresh(); S.tab="agents"; go(null); });
  if ($("adel")) $("adel").onclick = e => { if (confirm("Désactiver cet agent ? Son lien ne fonctionnera plus.")) run(e.currentTarget, async () => { await api("cleaner_delete",{id:c.id}); await refresh(); go(null); }); };
}

let recapMonth = null;
async function adminRecap(d) {
  header("Récapitulatif mensuel");
  recapMonth = recapMonth || d.today.slice(0,7);
  $("app").innerHTML = `<label class="f" style="margin-top:0">Mois</label><input type="month" id="rm" value="${recapMonth}"><div id="rr"><div class="empty"><span class="spin"></span></div></div>`;
  $("rm").onchange = e => { recapMonth = e.target.value; adminRecap(d); };
  try {
    const r = await api("recap",{month:recapMonth});
    const mins = (a,b) => { if(!a||!b) return 0; const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number); return Math.max(0,(h2*60+m2)-(h1*60+m1)); };
    const real = m => m.started_at&&m.finished_at ? Math.round((new Date(m.finished_at)-new Date(m.started_at))/60000) : 0;
    const fmt = n => `${Math.floor(n/60)}h${String(n%60).padStart(2,"0")}`;
    const by = {};
    r.missions.forEach(m => { const k = m.cleaner?.name||"Sans agent"; by[k] = by[k]||{n:0,plan:0,real:0}; by[k].n++; by[k].plan+=mins(m.start_time,m.end_time); by[k].real+=real(m); });
    $("rr").innerHTML = r.missions.length ? `<div class="card" style="margin-top:12px"><table class="t"><tr><th>Agent</th><th>Ménages</th><th>Prévu</th><th>Réel</th></tr>
      ${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${fmt(v.plan)}</td><td>${fmt(v.real)}</td></tr>`).join("")}</table></div>
      <div class="card" style="overflow-x:auto"><table class="t"><tr><th>Date</th><th>Logement</th><th>Agent</th><th>Réel</th></tr>
      ${r.missions.map(m=>`<tr><td>${fshort(m.date)}</td><td>${esc(m.property?.name)}</td><td>${esc(m.cleaner?.name||"—")}</td><td>${real(m)?fmt(real(m)):"—"}</td></tr>`).join("")}</table></div>
      <button class="btn block" id="csv">Exporter en CSV (Excel)</button>
      <p class="muted">Seuls les ménages terminés ou validés sont comptés. « Réel » = temps entre le début et la fin pointés dans l'appli.</p>` : `<div class="empty">Aucun ménage terminé ce mois-ci.</div>`;
    if ($("csv")) $("csv").onclick = () => {
      const rows = [["Date","Logement","Agent","Statut","Prévu (min)","Réel (min)"], ...r.missions.map(m=>[m.date,m.property?.name||"",m.cleaner?.name||"",ST[m.status],mins(m.start_time,m.end_time),real(m)])];
      const csv = "﻿" + rows.map(x=>x.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download = `menage-${recapMonth}.csv`; a.click();
    };
  } catch(e) { $("rr").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

document.addEventListener("visibilitychange", async () => { if (document.visibilityState==="visible") { swReg?.update?.().catch(() => {}); if (await checkUpdate()) return; } if (document.visibilityState==="visible" && S.role && !S.view) { if (S.role==="admin") refresh(); else renderAgent(); } });
checkUpdate().then(u => { if (!u) boot(); });
</script>
</body>
